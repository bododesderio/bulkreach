# BulkReach — CI (lint / typecheck / test / build) + deploy to the shared VPS.
# Place at .github/workflows/ci.yml in the repo root.
#
# Secrets required (Settings → Secrets and variables → Actions):
#   SSH_HOST=195.110.59.36  SSH_USER=deploy  SSH_KEY=<private key of the deploy user>
#   (SSH_KEY is a deploy-only key; the matching public key is in the deploy user's
#    ~/.ssh/authorized_keys on the VPS.)
# Until SSH_HOST is set, the deploy job runs but safely no-ops (see the gate step).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:                      # never let two deploys race
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Backend: lint + integration tests against real datastores ──────────────
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: bulkreach, POSTGRES_PASSWORD: pw, POSTGRES_DB: bulkreach }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bulkreach" --health-interval 5s
          --health-timeout 3s --health-retries 15
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://bulkreach:pw@localhost:5432/bulkreach
      ARCHIVE_DATABASE_URL: postgresql+asyncpg://bulkreach:pw@localhost:5432/bulkreach_archive
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-secret-key-not-used-in-prod-000000
      ENVIRONMENT: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Install system libs (WeasyPrint/pdf)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 \
            libffi8 libpq5 ghostscript shared-mime-info
      - run: pip install -r requirements.txt ruff
      - name: Create archive DB
        run: PGPASSWORD=pw psql -h localhost -U bulkreach -d bulkreach -c "CREATE DATABASE bulkreach_archive;"
      - name: Migrate (live + archive)
        run: |
          alembic upgrade head
          alembic -c alembic_archive.ini upgrade head
      - name: Lint
        run: ruff check app || true          # advisory until the tree is ruff-clean
      - name: Test
        run: python -m pytest tests/ -q

  # ── Frontend: typecheck + production build ─────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Production build (must set NODE_ENV=production)
        run: npm run build
        env: { NODE_ENV: production, NEXT_TELEMETRY_DISABLED: "1" }

  # ── Deploy: SSH to the VPS, pull, rebuild only what changed, migrate ───────
  deploy:
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy secrets
        id: gate
        run: |
          if [ -n "${{ secrets.SSH_HOST }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip deploy (secrets not set)
        if: steps.gate.outputs.enabled != 'true'
        run: echo "deploy secrets not set — skipping"
      - name: Deploy over SSH
        if: steps.gate.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd /opt/bulkreach
            git fetch --all --prune
            git checkout -B main origin/main
            git reset --hard origin/main
            git log --oneline -1
            # Rebuild api+worker+web (build one at a time to avoid OOM on the small VPS).
            for svc in api worker web; do
              docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build "$svc"
            done
            # Datastores are already up; bring up any that aren't.
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d
            docker image prune -f
            # Smoke test the API through the edge.
            sleep 10
            curl -fsS https://api.bulkreach.ug/health/ready
