# BulkReach — production stack. Self-contained: datastores + api + worker + web
# behind nginx. Datastores are internal-only (no host ports) so this can run
# alongside the dev containers; only nginx is published.
#
#   cp .env.production.example .env.production   # fill in secrets
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#   → app served at http://localhost:${WEB_HTTP_PORT:-8080}
# NB: --env-file is required — compose only auto-loads a file literally named .env.
name: bulkreach-prod

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://bulkreach:${POSTGRES_PASSWORD:-pw}@postgres:5432/bulkreach
  ARCHIVE_DATABASE_URL: postgresql+asyncpg://bulkreach:${POSTGRES_PASSWORD:-pw}@postgres:5432/bulkreach_archive
  REDIS_URL: redis://redis:6379/0
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PORT: "8123"
  CLICKHOUSE_DB: bulkreach
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio123}
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env.production}
  PAYMENTS_ENCRYPTION_KEY: ${PAYMENTS_ENCRYPTION_KEY:?set PAYMENTS_ENCRYPTION_KEY}
  ANON_PEPPER: ${ANON_PEPPER:-}
  ENVIRONMENT: production

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bulkreach
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pw}
      POSTGRES_DB: bulkreach
    volumes:
      - pg:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/10-archive-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bulkreach"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    environment:
      CLICKHOUSE_DB: bulkreach
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - ch:/var/lib/clickhouse
      - ./infra/clickhouse-open-networks.xml:/etc/clickhouse-server/users.d/z-open-networks.xml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    volumes: [minio:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: { context: ./backend, dockerfile: Dockerfile.prod }
    environment:
      <<: *app-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      clickhouse: { condition: service_started }
      minio: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build: { context: ./backend, dockerfile: Dockerfile.prod }
    command: ["arq", "app.workers.WorkerSettings"]
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "0"   # api owns migrations
    depends_on:
      api: { condition: service_started }
    restart: unless-stopped

  web:
    build: { context: ./frontend, dockerfile: Dockerfile.prod }
    environment:
      API_PROXY_URL: http://api:3101/api
      NODE_ENV: production
    depends_on:
      api: { condition: service_started }
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${WEB_HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  pg:
  redis:
  ch:
  minio:
