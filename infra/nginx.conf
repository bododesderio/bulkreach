# BulkReach reverse proxy. Same-origin: /api → FastAPI, everything else → Next.
# For TLS, terminate here (add a 443 server with certbot/Cloudflare certs) and
# redirect 80→443; this dev/prod-parity config listens on 80 only.
upstream bulkreach_api { server api:3101; }
upstream bulkreach_web { server web:3100; }

server {
    listen 80;
    server_name _;

    # Uploaded contact files (CSV/XLSX/PDF) can be large.
    client_max_body_size 50m;

    # Security headers (HSTS belongs on the 443 server once TLS is on).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://bulkreach_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE (campaign progress stream) — no buffering, long read timeout.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://bulkreach_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
